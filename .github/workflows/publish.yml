name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish-sbw:
    name: Publish sbw
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build
      - name: Build package
        working-directory: sbw
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sbw/dist/

  publish-vllm-sbw:
    name: Publish vllm-sbw
    runs-on: ubuntu-latest
    needs: publish-sbw  # vllm-sbw depends on sbw
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build
      - name: Build package
        working-directory: vllm_sbw
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: vllm_sbw/dist/
