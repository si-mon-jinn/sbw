[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbw"
version = "1.0.0"
description = "Stateless Bernoulli Watermarking for LLM-generated text detection"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.9"
authors = [
    { name = "Simone Ceppi" }
]
keywords = ["watermark", "llm", "nlp", "machine-learning", "pytorch", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "scipy>=1.10",
    "tokenizers>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/si-mon-jinn/sbw"
Documentation = "https://github.com/si-mon-jinn/sbw#readme"
Repository = "https://github.com/si-mon-jinn/sbw"

[tool.hatch.build.targets.wheel]
packages = ["sbw"]

[tool.hatch.build.targets.sdist]
include = [
    "sbw/**/*.py",
    "sbw/**/*.json",
    "README.md",
    "LICENSE",
]
